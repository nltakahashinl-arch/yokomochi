<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>横持便 週間予定表</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>横持便 週間予定表</h1><small>山陽自動車運送往復便</small></div><span id="status">接続中</span></header>
<main><nav><button id="prev">‹ 前週</button><button id="today">今週</button><button id="next">次週 ›</button><b id="range"></b><button id="helpBtn">利用方法</button><button id="addSlot">＋便追加</button><button id="history">変更履歴</button><button id="pdf" class="primary">PDF出力</button></nav><section class="legend"><span><i class="yellow"></i>変更あり・未確認</span><span><i class="red"></i>予約不可</span><span><i class="gray"></i>便なし</span></section><section class="paper"><h2>山陽自動車運送往復便　予定表</h2><div id="sub"></div><strong>黄色は変更あり（未確認）、赤塗りつぶしは予約不可です！！</strong><div id="grid"></div><section id="warehouseCards" class="warehouseCards"></section></section></main>
<dialog id="edit"><form id="editForm"><h3>配車予定</h3><div id="changeAlert" class="changeAlert" hidden>この予定には未確認の変更があります。</div><div class="form"><label>日付<input id="date" type="date" required></label><label>便<select id="slot"></select></label><label class="wide">行き先・ルート<input id="route" required></label><label>担当者 <em>必須</em><input id="driver" required></label><label>パレット枚数<input id="pl" placeholder="例：10枚"></label><label>変更担当者 <em id="whoMark" hidden>更新時必須</em><input id="who"></label><label class="wide">備考<textarea id="note"></textarea></label><label class="wide check"><input id="closed" type="checkbox"> 予約不可（赤塗りつぶし）</label></div><footer><button type="button" id="del" class="danger">削除</button><button type="button" id="confirmBtn" class="confirm" hidden>変更確認済みにする</button><span></span><button type="button" class="cancel">キャンセル</button><button class="primary">保存</button></footer></form></dialog>
<dialog id="slotDlg"><form id="slotForm"><h3>この週の便追加・管理</h3><div class="form"><label>便名<input id="slotName" required placeholder="例：臨時便 13:00～"></label><label>挿入位置<select id="slotPos"></select></label></div><div id="slotList" class="list"></div><footer><span></span><span></span><button type="button" class="cancel">閉じる</button><button class="primary">追加</button></footer></form></dialog>
<dialog id="histDlg"><div class="box"><h3>変更履歴</h3><div id="histList" class="list"></div><button class="cancel">閉じる</button></div></dialog>
<dialog id="helpDlg"><div class="box"><div class="dialogHead"><h3>利用方法</h3><button id="helpClose" class="x">×</button></div><div id="helpText" class="helpText"></div><div class="right"><button id="helpEdit">説明文を編集</button></div></div></dialog>
<dialog id="helpEditDlg"><form id="helpForm"><h3>利用方法の編集</h3><label>管理パスワード<input id="helpPassword" type="password" required></label><label>説明文<textarea id="helpBody" rows="14" required></textarea></label><footer><span></span><span></span><button type="button" class="cancel">キャンセル</button><button class="primary">保存</button></footer></form></dialog>
<dialog id="warehouseEditDlg"><form id="warehouseForm"><h3 id="warehouseTitle">倉庫情報の編集</h3><input id="warehouseIndex" type="hidden"><label>倉庫名<input id="warehouseName" required></label><label>住所<textarea id="warehouseAddress" rows="3" required></textarea></label><label>電話番号<input id="warehouseTel"></label><label>補足・会社名<textarea id="warehouseNote" rows="2"></textarea></label><label>変更者 <em>必須</em><input id="warehouseChangedBy" required></label><footer><span></span><span></span><button type="button" id="warehouseCancel">キャンセル</button><button class="primary">保存</button></footer></form></dialog>
<script type="module" src="main.js"></script><script type="module" src="warehouse.js"></script></body></html>
