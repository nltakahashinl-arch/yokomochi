<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>横持便 週間予定表</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>横持便 週間予定表</h1><small>山陽自動車運送往復便</small></div><div><span id="status">接続中</span><button id="newBtn" class="primary">＋ 予定登録</button></div></header>
<main><nav><button id="prevBtn">‹ 前週</button><button id="todayBtn">今週</button><button id="nextBtn">次週 ›</button><strong id="rangeLabel"></strong><button id="historyBtn">変更履歴</button><button id="pdfBtn" class="primary">PDF出力</button></nav><div id="message" hidden></div><p class="help">空いている枠をクリックして登録します。登録済みの枠をクリックすると編集・削除できます。</p><section class="paper"><h2>山陽自動車運送往復便　予定表</h2><div id="paperRange"></div><b class="warning">赤塗りつぶしは予約不可です！！</b><div id="grid" class="grid"></div></section><div id="totals"></div></main>
<dialog id="editor"><form id="form"><div class="title"><h3>配車予定</h3><button type="button" id="closeBtn" class="x">×</button></div><div class="fields"><label>日付<input id="date" type="date" required></label><label>便<select id="slot" required></select></label><label class="wide">行き先・ルート<input id="route" required placeholder="例：大阪⇒江見⇒山陽"></label><label>担当者 <em>必須</em><input id="driver" required placeholder="例：山野"></label><label>PL数・枚数<input id="pl" placeholder="例：12PL / 空パレット180枚"></label><label>変更担当者 <em id="changerMark" hidden>更新時必須</em><input id="changer" placeholder="更新した方の氏名"></label><label class="wide">備考<textarea id="note" rows="3"></textarea></label><label class="wide check"><input id="closed" type="checkbox"> 予約不可枠として赤表示</label></div><div class="actions"><button type="button" id="deleteBtn" class="danger">削除</button><i></i><button type="button" id="cancelBtn">キャンセル</button><button class="primary">保存</button></div></form></dialog>
<dialog id="historyDialog" class="history"><div class="historyBox"><div class="title"><div><h3>変更履歴</h3><small id="historyRange"></small></div><button id="historyClose" class="x">×</button></div><div id="historyList"></div></div></dialog>
<script type="module" src="main.js"></script></body></html>
