<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173b57">
  <title>横持便 週間予定表</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div><h1>横持便 週間予定表</h1><p>山陽自動車運送往復便</p></div>
  <div class="top-actions"><span id="status" class="status">接続中</span><button id="newBtn" class="btn primary">＋ 予定登録</button></div>
</header>
<main>
  <section class="toolbar">
    <button id="prevBtn" class="btn">‹ 前週</button><button id="todayBtn" class="btn">今週</button><button id="nextBtn" class="btn">次週 ›</button>
    <strong id="rangeLabel"></strong>
    <button id="pdfBtn" class="btn primary">PDF出力</button>
  </section>
  <div id="message" class="message" hidden></div>
  <p class="help">空いている枠をクリックして登録します。登録済みの枠をクリックすると編集・削除できます。</p>
  <section class="paper-wrap">
    <div class="paper">
      <h2>山陽自動車運送往復便　予定表</h2>
      <div id="paperRange" class="paper-range"></div>
      <div class="warning">赤塗りつぶしは予約不可です！！</div>
      <div id="scheduleGrid" class="schedule-grid"></div>
    </div>
  </section>
  <section id="totals" class="totals"></section>
</main>
<dialog id="editor">
  <form id="editForm">
    <div class="dialog-title"><h3>配車予定</h3><button type="button" id="closeBtn" class="close">×</button></div>
    <input id="documentId" type="hidden">
    <div class="form-grid">
      <label>日付<input id="dateInput" type="date" required></label>
      <label>便<select id="slotInput" required></select></label>
      <label class="wide">行き先・ルート<input id="routeInput" required placeholder="例：大阪⇒江見⇒山陽"></label>
      <label>担当者<input id="driverInput" placeholder="例：山野"></label>
      <label>PL数・枚数<input id="plInput" placeholder="例：12PL / 空パレット180枚"></label>
      <label class="wide">備考<textarea id="noteInput" rows="3" placeholder="返却不可、送り状、製品・半製品など"></textarea></label>
      <label class="check"><input id="closedInput" type="checkbox"> 予約不可枠として赤表示</label>
    </div>
    <div class="dialog-actions"><button type="button" id="deleteBtn" class="btn danger">削除</button><span></span><button type="button" id="cancelBtn" class="btn">キャンセル</button><button type="submit" class="btn primary">保存</button></div>
  </form>
</dialog>
<script type="module" src="main.js"></script>
</body>
</html>
